name: Capability wall and standard-library suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused capability-wall, dispatch, and init tests
        run: >-
          python -B -m unittest
          tests.test_wo_capability_wall
          tests.test_check_work_order_dispatch
          tests.test_init_sh
      - name: Full standard-library suite
        if: ${{ matrix.python-version != '3.10' }}
        run: python -B -m unittest discover -s tests

  required:
    name: CI required
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = "success"
